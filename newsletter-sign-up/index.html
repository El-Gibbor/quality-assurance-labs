<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./css/style.css" />

    <title>Newsletter sign-up</title>
  </head>
  <body>
    <main class="card">
      <div class="card__content">
        <h1 class="card__title">Stay updated!</h1>
        <p class="card__description">
          Join 60,000+ product managers receiving monthly updates on:
        </p>
        <ul class="benefits">
          <li class="benefits__item">
            <img class="benefits__icon" src="./assets/images/icon-list.svg" alt="" />
            <span>Product discovery and building what matters</span>
          </li>
          <li class="benefits__item">
            <img class="benefits__icon" src="./assets/images/icon-list.svg" alt="" />
            <span>Measuring to ensure updates are a success</span>
          </li>
          <li class="benefits__item">
            <img class="benefits__icon" src="./assets/images/icon-list.svg" alt="" />
            <span>And much more!</span>
          </li>
        </ul>

        <!-- novalidate: validation feedback is handled in JS so the
             browser's native error bubbles don't fight with it -->
        <form class="signup-form" novalidate>
          <div class="signup-form__field">
            <label for="email" class="signup-form__label">Email address</label>
            <input
              type="email"
              id="email"
              name="email"
              class="signup-form__input"
              placeholder="email@company.com"
              required
            />
          </div>
          <button type="submit" class="signup-form__submit">
            Subscribe to monthly newsletter
          </button>
        </form>
      </div>
      <img
        class="card__art"
        src="./assets/images/illustration-sign-up-desktop.svg"
        alt=""
        width="400"
        height="593"
      />
    </main>

    <script src="./js/script.js"></script>
  </body>
</html>
